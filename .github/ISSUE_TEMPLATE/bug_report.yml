name: Bug report
description: Report a problem with Alice Wallet
title: "[Bug]: "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for testing Alice. Please do not include seed phrases, private keys, API keys, or sensitive screenshots.
  - type: dropdown
    id: platform
    attributes:
      label: Platform
      options:
        - PWA
        - Android APK
        - iOS dev build
        - Other
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Version or commit
      placeholder: v0.1.0-demo or commit hash
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual behavior
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Open Alice
        2. Go to ...
        3. Tap ...
    validations:
      required: true
  - type: textarea
    id: notes
    attributes:
      label: Additional context
      description: Include screenshots only if they do not expose sensitive wallet data.
