name: Feature request
description: Suggest an improvement for Alice Wallet
title: "[Feature]: "
labels: ["enhancement"]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem or need
      description: What problem should Alice solve?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed solution
      description: What would you like to happen?
    validations:
      required: true
  - type: dropdown
    id: area
    attributes:
      label: Area
      options:
        - Wallet
        - PWA
        - Android
        - iOS
        - AI assistant
        - Documentation
        - Other
  - type: textarea
    id: context
    attributes:
      label: Additional context
